; Abschnitt für die ddraw.ini von cnc-ddraw (https://github.com/FunkyFr3sh/cnc-ddraw).
; Ans Ende der ddraw.ini im Spielordner kopieren.
; Das Spiel zeichnet intern mit 800 x 600 (4:3). cnc-ddraw skaliert das Bild hoch und beachtet dabei die
; Windows-Skalierung selbst: width/height sind echte Bildschirmpixel.
; Standard ist randloses Vollbild in der Monitorauflösung. Alt+Enter wechselt ins Fenster und zurück.
; Fenstergröße für kleinere Bildschirme anpassen: 1600x1200 für WQHD, 1200x900 für Full HD.
[Pizza_Mission]
renderer=opengl
fullscreen=true
windowed=true
toggle_borderless=true
border=true
resizable=true
maintas=true
width=2400
height=1800
; xBRZ glättet Pixelkanten auch bei krummen Faktoren (4K: 3,6-fach). Scharfe Blockpixel stattdessen:
; shader=Shaders\nearest-neighbor.glsl und boxing=true (ganzzahlig skaliert, mit schwarzem Rand).
shader=Shaders\xbrz\xbrz-freescale-multipass.glsl
center_window=2
savesettings=2
