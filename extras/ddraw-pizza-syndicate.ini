; Abschnitt für die ddraw.ini von cnc-ddraw (https://github.com/FunkyFr3sh/cnc-ddraw).
; Ans Ende der ddraw.ini im Spielordner kopieren.
; Das Spiel zeichnet intern mit 800 x 600 (4:3). width/height bestimmen die Fenstergröße:
;   1600x1200 für Full HD/WQHD, 2400x1800 für 4K. Ganzzahlige Vielfache bleiben mit nearest-neighbor scharf.
[Pizza_Mission]
renderer=opengl
windowed=true
fullscreen=false
border=true
resizable=true
maintas=true
width=1600
height=1200
shader=Shaders\nearest-neighbor.glsl
center_window=2
