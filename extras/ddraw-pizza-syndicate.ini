; Abschnitt für die ddraw.ini von cnc-ddraw (https://github.com/FunkyFr3sh/cnc-ddraw).
; Ans Ende der ddraw.ini im Spielordner kopieren.
; Das Spiel zeichnet intern mit 800 x 600 (4:3). width/height bestimmen die Fenstergröße in Windows-Punkten:
;   1600x1200 passt auf WQHD und auf 4K mit 150 % Skalierung, 2400x1800 nur auf 4K mit 100 %.
;   Ganzzahlige Vielfache bleiben mit nearest-neighbor scharf. Vollbild jederzeit mit Alt+Enter.
[Pizza_Mission]
renderer=opengl
windowed=true
fullscreen=false
border=true
resizable=true
maintas=true
width=1600
height=1200
shader=Shaders\nearest-neighbor.glsl
center_window=2
